# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shopnest-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: CLIENT_URL
        sync: false
